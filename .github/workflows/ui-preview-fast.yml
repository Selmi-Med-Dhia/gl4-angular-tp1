name: Quick Angular screenshot check
on:
  push:
    branches:
      - preview/angular-ui-capture
    paths:
      - .github/workflows/ui-preview-fast.yml
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Start real Angular app
        shell: bash
        run: |
          nohup npm start -- --host 127.0.0.1 --port 4200 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 100); do
            if curl -fsS http://127.0.0.1:4200/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/serve.log
          exit 1
      - name: Screenshot with bounded Chrome process
        shell: bash
        run: |
          mkdir -p preview/quick-shots
          for item in "home:/" "todo:/todo" "ttc:/ttc" "rainbow:/rainbow" "cv:/cv"; do
            slug="${item%%:*}"
            path="${item#*:}"
            echo "Capturing $slug"
            timeout 25s google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --no-first-run --hide-scrollbars --window-size=1365,850 --virtual-time-budget=1500 \
              --screenshot="$PWD/preview/quick-shots/$slug.png" "http://127.0.0.1:4200$path" > /tmp/capture-$slug.log 2>&1 || true
            test -s "preview/quick-shots/$slug.png" || { tail -15 /tmp/capture-$slug.log; exit 1; }
            ls -lh "preview/quick-shots/$slug.png"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: angular-browser-previews-quick
          path: preview/quick-shots
          retention-days: 30
      - name: Keep screenshots on preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/quick-shots
          git commit -m "test: store quick browser screenshots"
          git pull --rebase origin preview/angular-ui-capture
          git push origin HEAD:preview/angular-ui-capture
